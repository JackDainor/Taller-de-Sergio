<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#221c16" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Atelier Office" />
  <meta name="description" content="Administración de funcionarios, grupos, cortes, vales y pagos del taller de costura." />
  <title>Atelier Office — Jefe de oficina</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=8" />
</head>
<body>
  <div id="boot-loader" class="boot-loader" aria-live="polite" aria-busy="true">
    <div class="boot-card">
      <div class="boot-logo">AO</div>
      <div class="boot-spinner" aria-hidden="true"></div>
      <p class="boot-title">Atelier Office</p>
      <p class="boot-sub">Cargando taller…</p>
    </div>
  </div>

  <div class="app" id="appRoot" hidden>
    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <div class="brand-inline">
            <div class="logo" aria-hidden="true">AO</div>
            <div>
              <p class="crumb" id="crumb">Resumen del mes</p>
              <h2 id="pageTitle">Panel</h2>
            </div>
          </div>
        </div>
        <div class="top-actions">
          <button class="btn secondary" id="exportBtn" type="button">Exportar</button>
          <label class="btn secondary file-btn">
            Importar
            <input type="file" id="importInput" accept="application/json,.json" hidden />
          </label>
          <button class="menu-btn" id="menuBtn" type="button" aria-label="Abrir menú" aria-expanded="false" aria-controls="sideMenu">
            <span class="menu-btn-lines" aria-hidden="true"></span>
            <span class="menu-btn-text">Menú</span>
          </button>
        </div>
      </header>
      <p class="version-tag" id="versionTag">v8 · estado + foto</p>

      <div id="monthLockedBanner" class="locked-banner" hidden>
        Este mes está marcado como <strong>terminado</strong>. Podés consultarlo, pero no editar producción, grupos ni vales. Reabrilo desde el menú si necesitás corregir algo.
      </div>

      <section id="view-dashboard" class="view active"></section>
      <section id="view-workers" class="view"></section>
      <section id="view-garments" class="view"></section>
      <section id="view-groups" class="view"></section>
      <section id="view-cuts" class="view"></section>
      <section id="view-vales" class="view"></section>
      <section id="view-payroll" class="view"></section>
      <section id="view-settings" class="view"></section>
    </main>

    <div class="menu-overlay" id="menuOverlay" hidden></div>

    <aside class="side-menu" id="sideMenu" aria-hidden="true">
      <div class="side-menu-head">
        <div class="brand">
          <div class="logo" aria-hidden="true">AO</div>
          <div>
            <p class="eyebrow">Módulo actual</p>
            <h1 id="workspaceTitle">Atelier Office</h1>
          </div>
        </div>
        <button class="icon-btn side-close" id="menuCloseBtn" type="button" aria-label="Cerrar menú">×</button>
      </div>

      <label class="module-select">
        <span>Sección del sistema</span>
        <select id="moduleSelect">
          <option value="funcionarios" selected>Jefe de oficina · Funcionarios</option>
          <option value="proveedores" disabled>Jefe de oficina · Proveedores de corte (próximamente)</option>
        </select>
      </label>

      <nav class="nav" id="mainNav">
        <button type="button" class="nav-btn active" data-view="dashboard">Resumen</button>
        <button type="button" class="nav-btn" data-view="workers">Funcionarios</button>
        <button type="button" class="nav-btn" data-view="garments">Prendas</button>
        <button type="button" class="nav-btn" data-view="groups">Asignar corte</button>
        <button type="button" class="nav-btn" data-view="cuts">Cortes terminados</button>
        <button type="button" class="nav-btn" data-view="vales">Vales / adelantos</button>
        <button type="button" class="nav-btn" data-view="payroll">Pagos</button>
        <button type="button" class="nav-btn" data-view="settings">Ajustes y datos</button>
      </nav>

      <div class="sidebar-foot">
        <div class="month-box">
          <span>Mes de trabajo</span>
          <select id="monthSelect"></select>
          <div class="month-actions">
            <button class="btn ghost small" id="newMonthBtn" type="button">Nuevo mes</button>
            <button class="btn ghost small" id="toggleMonthStatusBtn" type="button">Cerrar mes</button>
          </div>
          <p class="month-status" id="monthStatusLabel"></p>
        </div>
        <button class="theme-toggle" id="themeToggle" type="button">Tema oscuro</button>
      </div>
    </aside>
  </div>

  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h3 id="modalTitle">—</h3>
        <button class="icon-btn" id="modalClose" type="button">×</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>
  <script src="app.js?v=8"></script>
</body>
</html>
